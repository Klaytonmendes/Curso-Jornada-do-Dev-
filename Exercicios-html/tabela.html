<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornada do Dev</title>
</head>
<body>
    <h1>Tabela</h1>
    <table border="1" cellpadding="15" cellspacing="0" width="30%">
    <caption>Veiculo</caption>  
        <thead>
            <tr>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Ano</th>
            </tr>
        </thead>
        <body>
            <tr>
                <td>Ford</td>
                <td>Fiesta</td>
                <td>2015</td>
            </tr>
            <tr>
                <td>Fiat</td>
                <td>Uno</td>
                <td>1997</td>
            </tr>
            <tr>
                <td>Chevrolet</td>
                <td>Prisma</td>
                <td>2020</td>
            </tr>
        </body>
        <tfoot>
            <td colspan="2">Total</td>
            <td>3</td>
        </tfoot>
    </table>
</body>
</html>
<!--
Para criar uma tabela, iniciamos com a tag table, tudo o que estiver dentro, será dela.
Segundo é a tag thead, para criar o cabeçalho.
Terceiro é o body.
Para se criar uma linha, a tag utilizada é a <tr>
Para se criar uma coluna, a tag utilizada é a <td>
Apenas dentro do thead, usa-se <th> para criar letras em negrito e centralizado
Para se ver a linha, use-se o atributo border dentro da table.
Para aumentar o espaçamento interno, podemos usar o cellpadding dentro da table.
Para aumentar ou diminuir o espaço entre linhas, podemos usar o atributo cellspacing.
Usa-se <caption> para o título de uma tabela
Fora do body criemos o <tfoot> para um rodapé 
O colspan usa-se para quando você quer que uma linha ocupe mais de uma coluna.
    -->
