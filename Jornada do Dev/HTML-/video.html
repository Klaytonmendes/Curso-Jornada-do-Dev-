<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornada do Dev</title>
</head>
<body>
    <h1>Video</h1>
    <video controls width="1024" height="768">

-->
