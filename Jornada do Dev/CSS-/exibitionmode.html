<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornada do Dev</title>
    <link type="text/css" rel="stylesheet" href="exibitionmode.css">
</head>
<body>
    <h1>Displays</h1>
    <div>
        Bloco -> Em linha
    </div>
    <p>
        Bloco -> Em linha
    </p>
    <span>
        Em linha -> Bloco
    </span>
</body>
</html>
<!--Display block é o modo de exibição padrão para elementos de bloco, como parágrafos e títulos. Ele faz com que o elemento ocupe toda a largura disponível e comece em uma nova linha. 
Display inline é o modo de exibição padrão para elementos em linha, como links e spans. Ele faz com que o elemento ocupe apenas a largura necessária e não comece em uma nova linha.
-->
