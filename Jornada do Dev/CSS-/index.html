<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jornada do Dev</title>
    <style type="text/css">
        p {
            color: red;
            font-size: 20px;
        }

        #p2 {
            color: blue;
            font-size: 30px;
        }

        .p3 {
            color: green;
            font-size: 40px;
        }
    </style>
</head>
<body>
<!-- Pelo HTML é mais difícil, pois ele generaliza -->
    <p>Parágrafo 1</p>
    <p>Parágrafo 2</p>
    <p>Parágrafo 3</p>
<!-- O ID é único e não pode ser repetido -->
    <p id="p1">Parágrafo 4</p>
    <p id="p2">Parágrafo 5</p>
<!-- As classes podem ser reutilizadas -->
    <p class="p3">Parágrafo 6</p>
    <p class="p3">Parágrafo 7</p>
    <p class="p3">Parágrafo 8</p>
</body>
</html>

<!-- O css funciona assim:
 selector {
     atributo: valor;
     atributo: valor;
 }

 Os seletores podem ser classificados em 3 tipos:
1. Seletores de Tag: selecionam elementos HTML pelo nome da tag.
2. Seletores de Classe: selecionam elementos HTML que possuem um atributo class específico.
3. Seletores de ID: selecionam elementos HTML que possuem um atributo id específico.

A parte inferior do código em CSS é mais importante, pois ela será a primeira a ser utilizada pelo código.

-->
